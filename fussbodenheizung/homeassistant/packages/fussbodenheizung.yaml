automation:
- id: fbh_zeitprogramm_anwenden
  alias: FBH – Zeitprogramm auf Sollwerte anwenden
  description: Setzt je Raum Komfort- oder Absenktemperatur an der Zentrale (Zeitplan, Abwesenheit). Manuelle
    Änderungen gelten bis zum nächsten Schaltpunkt.
  mode: queued
  triggers:
  - trigger: homeassistant
    event: start
  - trigger: state
    entity_id:
    - schedule.fbh_wohnen
    - schedule.fbh_kueche
    - schedule.fbh_bad
    - schedule.fbh_schlafen
    - schedule.fbh_kind
    - schedule.fbh_buero
  - trigger: state
    entity_id:
    - input_number.fbh_wohnen_komfort
    - input_number.fbh_wohnen_absenk
    - input_number.fbh_kueche_komfort
    - input_number.fbh_kueche_absenk
    - input_number.fbh_bad_komfort
    - input_number.fbh_bad_absenk
    - input_number.fbh_schlafen_komfort
    - input_number.fbh_schlafen_absenk
    - input_number.fbh_kind_komfort
    - input_number.fbh_kind_absenk
    - input_number.fbh_buero_komfort
    - input_number.fbh_buero_absenk
    - input_boolean.fbh_abwesend
    - input_boolean.fbh_zeitprogramm
  conditions:
  - condition: state
    entity_id: input_boolean.fbh_zeitprogramm
    state: 'on'
  actions:
  - repeat:
      for_each:
      - wohnen
      - kueche
      - bad
      - schlafen
      - kind
      - buero
      sequence:
      - variables:
          komfort: "{{ is_state('schedule.fbh_' ~ repeat.item, 'on') and not is_state('input_boolean.fbh_abwesend',\
            \ 'on') }}"
          soll: "{{ states('input_number.fbh_' ~ repeat.item ~ ('_komfort' if komfort else '_absenk'))\
            \ | float(20) }}"
          ziel: "climate.fbh_zentrale_{{ repeat.item }}"
      - condition: template
        value_template: "{{ states(ziel) not in ['unavailable', 'unknown'] }}"
      - action: climate.set_temperature
        target:
          entity_id: "{{ ziel }}"
        data:
          temperature: "{{ soll }}"
- id: fbh_fuehlerausfall_melden
  alias: FBH – Fühlerausfall melden
  mode: parallel
  triggers:
  - trigger: state
    entity_id:
    - sensor.fbh_zentrale_status_wohnen
    - sensor.fbh_zentrale_status_kueche
    - sensor.fbh_zentrale_status_bad
    - sensor.fbh_zentrale_status_schlafen
    - sensor.fbh_zentrale_status_kind
    - sensor.fbh_zentrale_status_buero
    to: Fühlerausfall (Ersatzbetrieb 30 %)
    for: "00:05:00"
  actions:
  - action: persistent_notification.create
    data:
      title: Fußbodenheizung
      notification_id: "fbh_{{ trigger.entity_id }}"
      message: "{{ state_attr(trigger.entity_id, 'friendly_name') }}: kein Messwert vom Raumsensor seit\
        \ 15 min – Ventil läuft mit 30 % Ersatzbetrieb."
- id: fbh_zentrale_offline_melden
  alias: FBH – Zentrale nicht erreichbar
  mode: single
  triggers:
  - trigger: state
    entity_id: climate.fbh_zentrale_wohnen
    to: unavailable
    for: "00:10:00"
  actions:
  - action: persistent_notification.create
    data:
      title: Fußbodenheizung
      notification_id: fbh_zentrale
      message: Die FBH-Zentrale ist seit 10 min nicht erreichbar. Sie regelt lokal mit den zuletzt gespeicherten
        Sollwerten weiter; Zeitprogramm wirkt erst wieder nach Verbindung.
